name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#FF69B4&color_dots=#FCE4EC,#F8BBD0,#EF93C4,#F06292,#FF69B4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF69B4&color_dots=#1A0B1E,#4A1D3A,#8E3B6B,#EF93C4,#FF69B4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
